<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f0fdfa" />
    <title>Simple Webhook Receiver</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060a13'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle'%3E%F0%9F%AA%9D%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="top-bar">
        <h1>Simple Webhook Receiver</h1>
        <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle dark mode"></button>
      </div>
      <p class="subtitle">Single endpoint. Live only while this page is open. No storage.</p>

      <section class="card">
        <h2>Your Webhook URL</h2>
        <div class="endpoint-row">
          <code id="endpoint"></code>
          <button id="copy-btn" type="button">Copy</button>
        </div>
        <p class="note">Send GET/POST/PUT/PATCH/DELETE requests to this URL from your workflow.</p>
      </section>

      <section class="card">
        <div class="latest-header">
          <h2>Live Requests</h2>
          <span id="status" class="status">Connecting...</span>
        </div>

        <div class="split">
          <ul id="events" class="events"></ul>
          <div class="detail-panel">
            <div class="detail-tabs">
              <button class="detail-tab active" data-tab="body">Body</button>
              <button class="detail-tab" data-tab="meta">Headers &amp; Meta</button>
              <div class="detail-tab-actions">
                <button id="copy-detail" class="copy-detail-btn" type="button">Copy</button>
              </div>
            </div>
            <div class="detail-content">
              <pre id="details">Waiting for webhook...</pre>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
